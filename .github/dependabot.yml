version: 2

updates:
  # ---- PHP / Composer dependencies ----
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Don't auto-open PRs for releases younger than 7 days; most compromised
    # releases are yanked within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      # Keep the Symfony components moving together; a split bump
      # (process 6.4 + di 7.0) is almost always wrong.
      symfony:
        patterns:
          - "symfony/*"
      # All dev-only tooling (phpunit, prophecy bridge, …) in one PR.
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"

  # ---- GitHub Actions used by workflows ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
